name: Import original VICE '86 release
# One-time source vendoring for the working branch. No deployment, third-party
# build, or execution of downloaded code. Never write to the default branch.
on:
  push:
    branches: ['arena/2cd47a60-vice-86-revanced']
    paths: ['.github/workflows/import-vice-source.yml', 'tools/import_release.py']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Import and verify the pinned browser module graph
        run: |
          python3 tools/import_release.py --out "$RUNNER_TEMP/vice-release"
          mkdir -p upstream
          cp -R "$RUNNER_TEMP/vice-release/." upstream/
      - name: Save original bytes on this branch
        if: github.ref == 'refs/heads/arena/2cd47a60-vice-86-revanced'
        run: |
          git add -- upstream
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Vendor VICE '86 public runtime 9d646599b896"
          git push origin "HEAD:${GITHUB_REF_NAME}"
