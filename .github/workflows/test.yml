# The suite. There is nothing to install and nothing to build: the game is a web page (web/) and the tests
# are plain `node --test` from the repository root, so this is a checkout, a Node, and a command.
#
# It exists because two ReferenceErrors once shipped in a release. Both were in code only a browser
# reaches — the crowd's cast loading, and a gun being fired in front of witnesses — and both were thrown
# where something else caught them or where the frame simply stopped, so the game ran and looked almost
# right: a street with nobody on it, and a pistol that would not fire. Two hundred and ninety-three tests
# passed the whole time, because none of them ran those two lines. Now the tests run on the way out of the
# door rather than only on somebody's machine, and the two lines are covered.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The same major version the desktop build packages with, so a failure here is a failure there.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The suite
        run: node --test

      - name: Every module still parses
        # `node --test` only loads the modules a test imports. This walks the whole graph, so a syntax
        # error or a bad import in a file no test reaches is caught here instead of in a browser.
        run: |
          node --input-type=module -e '
            globalThis.self = globalThis;   // a worker global scope, for the one module that lives in one
            import { readdirSync, statSync } from "node:fs";
            const out = [];
            (function walk(dir) {
              for (const name of readdirSync(dir)) {
                const p = `${dir}/${name}`, st = statSync(p);
                if (st.isDirectory()) walk(p);
                else if (name.endsWith(".js")) out.push(p);
              }
            })("web/src");
            let bad = 0;
            for (const p of out) {
              try { await import(`./${p}`); }
              catch (e) { console.error(`${p}: ${e.message}`); bad++; }
            }
            console.log(`${out.length} modules, ${bad} failed to load`);
            if (bad) process.exit(1);
          '
