<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VICE '86</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="VICE '86: a free-roam drive through a neon 1986, generated entirely by code.">
  <meta name="theme-color" content="#0A0618">
  <meta name="color-scheme" content="dark">
  <!-- An inline icon, so the browser never requests a favicon file that does not exist. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230A0618'/%3E%3Cpath fill='none' stroke='%23fff' stroke-width='5' stroke-linejoin='bevel' d='M17 16l12 28l12-28'/%3E%3Cpath stroke='%23FF2E88' stroke-width='4' d='M22 54h28' transform='skewX(-11)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="game" tabindex="-1" aria-label="VICE '86"></canvas>

  <!-- UI overlay. src/ui builds the HUD and menus in here; the loading screen is static so that it
       is on screen before any script has run, and src/ui/screens-system.js takes it over. Its
       structure must match buildLoading() and wordmark() in src/ui. -->
  <div id="ui" class="ui">
    <div class="loading is-on">
      <div class="wordmark loading__wordmark" role="img" aria-label="VICE '86">
        <div class="wordmark__title"><span class="wordmark__word">VICE</span><span class="wordmark__year">’86</span></div>
        <div class="wordmark__line"></div>
        <div class="wordmark__stripes"><i></i><i></i></div>
        <div class="wordmark__tag">Paloma Drive · 1986</div>
      </div>
      <div class="loading__progress">
        <div class="loading__row"><span class="loading__label">Starting</span><span class="loading__percent">0%</span></div>
        <div class="loading__bar"><div class="loading__fill"></div></div>
      </div>
      <div class="loading__tip"></div>
    </div>
  </div>

  <script>
    // The loading screen is on screen before any module has run, so the measurement that
    // src/ui/type.js makes (fitDisplayType: how wide the display face that resolved is, and the
    // --squeeze / --cell it implies) is made here as well, for the first paint. Keep the two the
    // same; test/ui/type.test.mjs compares them.
    (function () {
      var root = document.getElementById('ui');
      var probe = document.createElement('span');
      probe.className = 'ui__probe';
      root.appendChild(probe);
      function advance(text) {
        probe.textContent = text;
        return probe.getBoundingClientRect().width / (100 * text.length);
      }
      function round(value) { return Math.round(value * 1000) / 1000; }
      var caps = advance('HAMBURGEVONS');
      var squeeze = caps > 0.62 ? round(Math.max(0.72, 0.58 / caps)) : 1;
      var figures = advance('0123456789');
      var cell = figures > 0 ? round(Math.min(0.6, Math.max(0.5, figures * squeeze + 0.03))) : 0.5;
      root.removeChild(probe);
      root.style.setProperty('--squeeze', String(squeeze));
      root.style.setProperty('--cell', String(cell));
    })();
  </script>

  <noscript><p class="notice">VICE '86 needs JavaScript. Turn it on for this page and reload.</p></noscript>

  <script nomodule>
    // Browsers without ES modules cannot run the game; say so instead of loading for ever.
    document.querySelector('.loading__label').textContent = 'This browser is too old to run the game';
  </script>
  <script>
    // If the game's entry module (or anything it imports) fails to load or parse, no game code runs
    // to report it. Until the UI has started (it marks #ui with data-screen), put the failure on
    // the loading screen. After that, errors are the game's to handle.
    (function () {
      var ui = document.getElementById('ui');
      function report(text) {
        if (ui.hasAttribute('data-screen')) return;
        ui.querySelector('.loading__label').textContent = 'Could not start: ' + text;
        ui.querySelector('.loading').classList.add('is-failed');
      }
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (target && target.tagName === 'SCRIPT') report('a game file failed to load (' + (target.getAttribute('src') || 'script') + ')');
        else if (event.message) report(event.message);
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        report(event.reason && event.reason.message ? event.reason.message : String(event.reason));
      });
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
